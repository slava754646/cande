<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CandeCraft — реалістичний воксельний світ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="hud">
      <div>
        <h1>CandeCraft</h1>
        <p>Міні-пісочниця у стилі Minecraft з більш реалістичним освітленням.</p>
      </div>
      <div class="hud__panel">
        <h2>Керування</h2>
        <ul>
          <li><strong>WASD</strong> — рух</li>
          <li><strong>Миша</strong> — огляд</li>
          <li><strong>Пробіл</strong> — піднятись</li>
          <li><strong>Shift</strong> — опуститись</li>
          <li><strong>R</strong> — перегенерувати світ</li>
        </ul>
      </div>
    </div>
    <div id="scene"></div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
